<svg viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Official Microsoft Outlook logo -->
  <g transform="translate(8,8)">
    <!-- Main envelope background -->
    <rect x="0" y="4" width="20" height="16" rx="1" fill="#0078D4"/>
    <!-- Envelope flap -->
    <path d="M0 4 L10 12 L20 4 L20 6 L10 14 L0 6 Z" fill="#005A9F"/>
    <!-- White O overlay -->
    <circle cx="14" cy="16" r="5" fill="#FFFFFF" stroke="#0078D4" stroke-width="1"/>
    <text x="14" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#0078D4">O</text>
  </g>
  <text x="32" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2d3748">Outlook</text>
</svg>
